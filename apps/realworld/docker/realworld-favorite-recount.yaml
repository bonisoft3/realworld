# generated by pronto from program.cue — do not edit
input:
  redis_streams:
    url: '${REDIS_URL}'
    streams:
      - cdc-events
    body_key: data
    consumer_group: realworld-favorite-recount
pipeline:
  processors:
    - mapping: 'root = if this.exists("data") && this.data.type() == "string" && this.data.length() > 0 { this } else { deleted() }'
    - try:
        - bloblang: |
            let carriers = {"app_user":{"id":"uuid","handle":"string","display_name":"string","bio":"string","image_url":"string","created_at":"timestamp"},"article":{"id":"uuid","author_id":"uuid","title":"string","description":"string","body":"string","tags":"string","cover_url":"string","cover_credit":"string","slug":"string","created_at":"timestamp","updated_at":"timestamp","reading_minutes":"int32"},"article_tag":{"id":"uuid","article_id":"uuid","tag":"string"},"comment":{"id":"uuid","article_id":"uuid","author_id":"uuid","body":"string","created_at":"timestamp"},"favorite":{"id":"uuid","user_id":"uuid","article_id":"uuid","created_at":"timestamp","deleted_at":"timestamp"},"bookmark":{"id":"uuid","user_id":"uuid","article_id":"uuid","created_at":"timestamp"},"follow":{"id":"uuid","follower_id":"uuid","followed_id":"uuid","created_at":"timestamp"}}
            # The bus row, in carrier form. Conduit decodes a column of a base type
            # natively — an integer as a JSON number, a date as RFC 3339 midnight UTC —
            # and passes a domain through as Postgres's text output (`2026-09-22
            # 14:18:21.84623+00`, `08:00:00`, `"1"`), and every pipeline's mapping would
            # otherwise have to know each spelling. This runs first, so a mapping reads
            # `this.data` as the carriers the entities declare, the same strings PostgREST
            # and the client hold.
            #
            # `$carriers` is prepended by emit.cue: {table: {column: carrier}} over the
            # tables the publication carries. A column it does not name (__table, txid,
            # scope_id, a tsvector) passes through untouched. A value that is not the
            # spelling measured for its carrier throws, and the pipeline's catch logs and
            # drops the event: a guess here would be a second, quieter canonical form.

            # The walsender renders a timestamptz in the SERVER's zone, and that text is
            # what reaches the bus. The image runs UTC, so the offset is `+00`; a cluster
            # whose postgres ran a half-hour zone would spell `+05:30`, which this layout
            # refuses rather than mis-reads.
            map pg_timestamp {
              root = this.ts_parse("2006-01-02 15:04:05Z07").ts_format("2006-01-02T15:04:05.000000Z", "UTC")
            }

            # An interval without a day or month part prints as clock text, hours
            # unbounded; the carrier is total seconds with the fraction's zeros trimmed.
            map pg_duration {
              let m = this.re_find_all_submatch("^([0-9]+):([0-9]{2}):([0-9]{2})(?:\\.([0-9]*?)0*)?$")
              root = if $m.length() != 1 {
                throw("duration is not clock text: " + this)
              } else {
                "PT" + ($m.index(0).index(1).number().int64() * 3600 + $m.index(0).index(2).number().int64() * 60 + $m.index(0).index(3).number().int64()).string() + if $m.index(0).index(4) == "" { "S" } else { "." + $m.index(0).index(4) + "S" }
              }
            }

            map pg_time {
              let m = this.re_find_all_submatch("^([0-9]{2}:[0-9]{2}:[0-9]{2})(?:\\.([0-9]{1,6}))?$")
              root = if $m.length() != 1 {
                throw("time is not clock text: " + this)
              } else {
                $m.index(0).index(1) + "." + ($m.index(0).index(2) + "000000").slice(0, 6)
              }
            }

            # Numeric text keeps the scale it was computed at; the carrier has no trailing
            # fractional zeros and no negative zero.
            map pg_decimal {
              root = if this.type() != "string" || !this.re_match("^-?[0-9]+(\\.[0-9]+)?$") {
                throw("decimal is not numeric text: " + this.string())
              } else {
                this.string().re_replace_all("^(-?[0-9]+\\.[0-9]*?)0+$", "$1").re_replace_all("\\.$", "").re_replace_all("^-0$", "0")
              }
            }

            map pg_bool {
              root = if this.type() != "bool" { throw("bool is not a JSON boolean: " + this.string()) } else { this }
            }

            # An int64 is a domain, so conduit spells it as Postgres text; a JSON number
            # would have been truncated past 2^53 before this mapping saw it.
            map pg_integer {
              root = if this.type() != "string" || !this.re_match("^-?[0-9]+$") {
                throw("integer is not decimal text: " + this.string())
              } else {
                this
              }
            }

            # An int32 is a base integer, which conduit decodes as a JSON number; read
            # with use_number, so a fraction or an exponent is still visible here.
            map pg_int32 {
              root = if this.type() != "number" || !this.string().re_match("^-?[0-9]+$") {
                throw("int32 is not a JSON integer: " + this.string())
              } else {
                this.int64()
              }
            }

            map pg_double {
              root = if this.type() != "number" { throw("double is not a JSON number: " + this.string()) } else { this.number() }
            }

            map pg_uuid {
              root = if this.type() != "string" || !this.re_match("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$") {
                throw("uuid is not lowercase and hyphenated: " + this.string())
              } else {
                this
              }
            }

            # A date is a time.Time to conduit, so it arrives as that day's midnight UTC.
            map pg_date {
              root = if this.type() != "string" || !this.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}T00:00:00Z$") {
                throw("date is not RFC 3339 midnight UTC: " + this.string())
              } else {
                this.slice(0, 10)
              }
            }

            map pg_text {
              root = if this.type() != "string" { throw("text is not a JSON string: " + this.string()) } else { this }
            }

            # A column no carrier names, or a null, passes through as it came.
            map carrier {
              root = if (this.type == null) || (this.value == null) { this.value } else {
                match {
                  this.type == "timestamp" => this.value.apply("pg_timestamp"),
                  this.type == "duration" => this.value.apply("pg_duration"),
                  this.type == "time" => this.value.apply("pg_time"),
                  this.type == "decimal" => this.value.apply("pg_decimal"),
                  this.type == "bool" => this.value.apply("pg_bool"),
                  this.type == "date" => this.value.apply("pg_date"),
                  this.type == "int32" => this.value.apply("pg_int32"),
                  this.type == "int64" => this.value.apply("pg_integer"),
                  this.type == "double" => this.value.apply("pg_double"),
                  this.type == "uuid" => this.value.apply("pg_uuid"),
                  this.type == "string" => this.value.apply("pg_text"),
                  this.type == "timezone" => this.value.apply("pg_text"),
                  _ => throw("no measured bus spelling for " + this.type + "; measure conduit's before publishing one"),
                }
              }
            }

            # use_number keeps an integer past 2^53 exact: this mapping re-encodes every
            # row it reads, and a float64 round trip would rewrite a txid silently.
            let row = this.data.parse_json(use_number: true)
            let table = if $row.type() != "object" || !$row.exists("__table") {
              throw("a bus row is a JSON object conduit stamped __table: " + this.data)
            } else {
              $row.__table
            }
            let types = $carriers.get($table).or({})
            root = this
            let typed = $row.map_each(c -> {"type": $types.get(c.key), "value": c.value}.apply("carrier"))
            root.data = $typed.format_json(no_indent: true, escape_html: false).string()
        - branch:
            processors:
              - http:
                  headers:
                    Authorization: 'Bearer ${SERVICE_JWT}'
                  url: '${CRUD_URL}/favorite?select=article_id,txid,deleted_at'
                  verb: GET
            result_map: root.rows = this
        - bloblang: |
            # favorite-recount (ir favorite-recount, test-favorite-recount-groups,
            # test-favorite-recount-zero): absolute recount of `favorite` grouped per
            # article_id, emitted as the ARRAY of article_stats upsert rows
            # {article_id, favorite_count, counted_txid}, conflicting on article_id.
            #
            # Harness contract this mapping requires: the branch preserves the CDC event
            # beside the fetched rows (result_map: root.rows = this). The bus message is
            # the dapr CloudEvent envelope whose .data field is the changed row as a JSON
            # string — conduit posts Payload.After, with a delete's After back-filled from
            # Before by the restore-deleted-row processor. A bare rows array at the root
            # means the harness discarded the event, which would ship the stale-final bug
            # silently: refuse loudly instead.
            let rows = if this.type() == "array" { throw("favorite-recount: harness discarded the CDC event (result_map: root = this); #rpkPipeline must preserve it as root.rows") } else { this.rows }
            let event_row = if this.exists("data") && this.data.type() == "string" && this.data.length() > 0 { this.data.parse_json() } else { null }

            # Source discriminator. The bus carries every table and this stream reads all
            # of it, so a foreign message must be dropped rather than reassert the sink:
            # merge-duplicates is ON CONFLICT DO UPDATE, which restamps txid on every row
            # it touches and would fan the whole sink out to every tab.
            #
            # It tests the table conduit stamped onto the row, NOT the shape of the row.
            # Shape cannot decide this: `bookmark` and `favorite` are column-identical, so
            # the `user_id` witness this once used matched both and every bookmark write
            # silently restamped article_stats.
            # The key must be present too. A conduit misconfiguration can put a row on the
            # bus carrying only the stamp — a delete whose before-image was lost — and
            # without this the mapping emits a null-keyed sink row, PostgREST rejects it,
            # the retry never succeeds and the whole stream wedges behind it.
            let from_favorite = $event_row.type() == "object" && $event_row.__table == "favorite" && $event_row.exists("article_id")

            # ONE row: the article the event touched, and nothing else. The count is still
            # absolute — it is the length of the fetched set, never a delta — but the SCOPE
            # of the emission is the event's own article (ir decision-narrow-recount).
            #
            # Emitting every group was the earlier shape and it was expensive in a way that
            # reached the screen. merge-duplicates is ON CONFLICT DO UPDATE and the
            # restamp_txid trigger fires on any UPDATE, including one writing an unchanged
            # count — so re-emitting every article restamped every article_stats row on
            # every favorite anywhere.
            #
            # No union is needed: the last un-favorite drops the article out of the fetched
            # grouping, and the event's own article_id is emitted regardless, so the count
            # is driven to zero by construction rather than by a special case.
            #
            # ACCEPTED LOSS, named rather than discovered: recounting every article made a
            # dropped event self-healing — the next event for any article repaired all of
            # them. Narrowed, a dropped event leaves that one article's count stale until
            # something touches it again.
            let id = $event_row.article_id
            # Every row for this article, active or retracted. The COUNT takes the active
            # ones; the WATERMARK takes the newest txid of all of them, and that difference
            # is load-bearing. Filtering the read to active rows would leave a row the
            # reader has just retracted sitting above the watermark, where the browser
            # reads it as a change the sink has not seen and subtracts it a second time.
            let mine = $rows.filter(r -> r.article_id == $id)
            let live = $mine.filter(r -> r.deleted_at == null)

            # counted_txid is the READ WATERMARK: the newest source row this count
            # includes. It is not article_stats.txid and cannot be — that one is stamped
            # when the sink row is WRITTEN, which is strictly after this read, so every
            # favorite committed in between looks older than the sink while never having
            # been counted. The browser's optimistic projection subtracts on exactly this
            # comparison (ir decision-optimistic-fold), and with the write stamp it drops
            # the reader's own fresh favorite and shows a count one too low.
            # Zero for an empty group: every local row is then newer, which is correct.
            # The txids sort as integers and leave as the int64 carrier's canonical string;
            # sorted as strings, "9" would outrank "10".
            root = if $from_favorite {
              [{
                "article_id":     $id,
                "favorite_count": $live.length(),
                "counted_txid":   if $mine.length() == 0 { "0" } else { $mine.map_each(r -> r.txid.or(0).int64()).sort().index(-1).string() },
              }]
            } else {
              deleted()
            }
    - catch:
        - log:
            level: ERROR
            message: 'favorite-recount: transform failed (${! error() }) on ${! content() }'
        - mapping: root = deleted()
output:
  retry:
    max_retries: 3
    backoff:
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 3m
    output:
      http_client:
        url: '${CRUD_URL}/article_stats?on_conflict=article_id'
        verb: POST
        headers:
          Authorization: 'Bearer ${SERVICE_JWT}'
          Content-Type: application/json
          Prefer: resolution=merge-duplicates
        successful_on:
          - 200
          - 201
