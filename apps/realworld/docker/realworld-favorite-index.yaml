# generated by pronto from program.cue — do not edit
input:
  redis_streams:
    url: '${REDIS_URL}'
    streams:
      - cdc-events
    body_key: data
    consumer_group: realworld-favorite-index
pipeline:
  processors:
    - mapping: 'root = if this.exists("data") && this.data.type() == "string" && this.data.length() > 0 { this } else { deleted() }'
    - try:
        - bloblang: |
            let carriers = {"app_user":{"id":"uuid","handle":"string","display_name":"string","bio":"string","image_url":"string","created_at":"timestamp"},"article":{"id":"uuid","author_id":"uuid","title":"string","description":"string","body":"string","tags":"string","cover_url":"string","cover_credit":"string","slug":"string","created_at":"timestamp","updated_at":"timestamp","reading_minutes":"int32"},"article_tag":{"id":"uuid","article_id":"uuid","tag":"string"},"comment":{"id":"uuid","article_id":"uuid","author_id":"uuid","body":"string","created_at":"timestamp"},"favorite":{"id":"uuid","user_id":"uuid","article_id":"uuid","created_at":"timestamp","deleted_at":"timestamp"},"bookmark":{"id":"uuid","user_id":"uuid","article_id":"uuid","created_at":"timestamp"},"follow":{"id":"uuid","follower_id":"uuid","followed_id":"uuid","created_at":"timestamp"}}
            # The bus row, in carrier form. Conduit spells a column as Postgres's text
            # output — `2026-09-22 14:18:21.84623+00`, `08:00:00`, `"1"` — and every
            # pipeline's mapping would otherwise have to know each spelling. This runs
            # first, so a mapping reads `this.data` as the carriers the entities declare,
            # the same strings PostgREST and the client hold.
            #
            # `$carriers` is prepended by emit.cue: {table: {column: carrier}} over the
            # tables the publication carries. A column it does not name (__table, txid,
            # scope_id, a tsvector) passes through untouched. A value that is not the
            # spelling measured for its carrier throws, and the pipeline's catch logs and
            # drops the event: a guess here would be a second, quieter canonical form.

            # The walsender renders a timestamptz in the SERVER's zone, and that text is
            # what reaches the bus. The image runs UTC, so the offset is `+00`; a cluster
            # whose postgres ran a half-hour zone would spell `+05:30`, which this layout
            # refuses rather than mis-reads.
            map pg_timestamp {
              root = this.ts_parse("2006-01-02 15:04:05Z07").ts_format("2006-01-02T15:04:05.000000Z", "UTC")
            }

            # An interval without a day or month part prints as clock text, hours
            # unbounded; the carrier is total seconds with the fraction's zeros trimmed.
            map pg_duration {
              let m = this.re_find_all_submatch("^([0-9]+):([0-9]{2}):([0-9]{2})(?:\\.([0-9]*?)0*)?$")
              root = if $m.length() != 1 {
                throw("duration is not clock text: " + this)
              } else {
                "PT" + ($m.index(0).index(1).number().int64() * 3600 + $m.index(0).index(2).number().int64() * 60 + $m.index(0).index(3).number().int64()).string() + if $m.index(0).index(4) == "" { "S" } else { "." + $m.index(0).index(4) + "S" }
              }
            }

            map pg_time {
              let m = this.re_find_all_submatch("^([0-9]{2}:[0-9]{2}:[0-9]{2})(?:\\.([0-9]{1,6}))?$")
              root = if $m.length() != 1 {
                throw("time is not clock text: " + this)
              } else {
                $m.index(0).index(1) + "." + ($m.index(0).index(2) + "000000").slice(0, 6)
              }
            }

            # Numeric text keeps the scale it was computed at; the carrier has no trailing
            # fractional zeros and no negative zero.
            map pg_decimal {
              root = if this.type() != "string" || !this.re_match("^-?[0-9]+(\\.[0-9]+)?$") {
                throw("decimal is not numeric text: " + this.string())
              } else {
                this.string().re_replace_all("^(-?[0-9]+\\.[0-9]*?)0+$", "$1").re_replace_all("\\.$", "").re_replace_all("^-0$", "0")
              }
            }

            map pg_bool {
              root = match this {
                "t" => true,
                "f" => false,
                _ => throw("bool is not t or f: " + this.string()),
              }
            }

            # conduit spells every column as Postgres text, integers included; a JSON
            # number would have been truncated past 2^53 before this mapping saw it.
            map pg_integer {
              root = if this.type() != "string" || !this.re_match("^-?[0-9]+$") {
                throw("integer is not decimal text: " + this.string())
              } else {
                this
              }
            }

            map pg_date {
              root = if !this.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { throw("date is not YYYY-MM-DD: " + this) } else { this }
            }

            # A column no carrier names, or a null, passes through as it came.
            map carrier {
              root = if (this.type == null) || (this.value == null) { this.value } else {
                match {
                  this.type == "timestamp" => this.value.apply("pg_timestamp"),
                  this.type == "duration" => this.value.apply("pg_duration"),
                  this.type == "time" => this.value.apply("pg_time"),
                  this.type == "decimal" => this.value.apply("pg_decimal"),
                  this.type == "bool" => this.value.apply("pg_bool"),
                  this.type == "date" => this.value.apply("pg_date"),
                  this.type == "int32" => this.value.apply("pg_integer").int64(),
                  this.type == "int64" => this.value.apply("pg_integer"),
                  this.type == "double" => this.value.number(),
                  this.type == "uuid" => this.value.lowercase(),
                  this.type == "string" => this.value,
                  this.type == "timezone" => this.value,
                  _ => throw("no measured bus spelling for " + this.type + "; measure conduit's before publishing one"),
                }
              }
            }

            # use_number keeps an integer past 2^53 exact: this mapping re-encodes every
            # row it reads, and a float64 round trip would rewrite a txid silently.
            let row = this.data.parse_json(use_number: true)
            let table = if $row.type() != "object" || !$row.exists("__table") {
              throw("a bus row is a JSON object conduit stamped __table: " + this.data)
            } else {
              $row.__table
            }
            let types = $carriers.get($table).or({})
            root = this
            let typed = $row.map_each(c -> {"type": $types.get(c.key), "value": c.value}.apply("carrier"))
            root.data = $typed.format_json(no_indent: true, escape_html: false).string()
        - branch:
            processors:
              - http:
                  headers:
                    Authorization: 'Bearer ${SERVICE_JWT}'
                  url: '${CRUD_URL}/favorite?select=user_id,article_id,created_at,deleted_at'
                  verb: GET
            result_map: root.rows = this
        - bloblang: |
            # favorite-index (ir favorite-index, test-favorite-index-cross-user,
            # test-favorite-index-retracts): the cross-user pair index no screen read can
            # state, emitted as the ARRAY of favorite_index upsert rows keyed
            # <user_id>:<article_id> and conflicting on id.
            #
            # Harness contract: as favorite-recount.
            let rows = if this.type() == "array" { throw("favorite-index: harness discarded the CDC event (result_map: root = this); #rpkPipeline must preserve it as root.rows") } else { this.rows }
            let event_row = if this.exists("data") && this.data.type() == "string" && this.data.length() > 0 { this.data.parse_json() } else { null }

            # Same `user_id` discriminator, same reason, as favorite-recount — and it
            # matters most here, because this sink grows in the number of pairs ever
            # favorited, so reasserting it in full on an unrelated event is the largest
            # write in the app.
            # The table conduit stamped, not the shape of the row: `bookmark` and
            # `favorite` are column-identical, so a witness column matches both.
            let from_favorite = $event_row.type() == "object" && $event_row.__table == "favorite" && $event_row.exists("article_id")

            # A retracted favourite is still a row, so it must be filtered out here or the
            # reader's profile keeps listing a piece they un-favourited.
            let active_rows = $rows.filter(r -> r.deleted_at == null).map_each(r -> {
              "id": r.user_id + ":" + r.article_id,
              "user_id": r.user_id,
              "article_id": r.article_id,
              "active": true,
              "favorited_at": r.created_at,
            })

            # An upsert-only sink retracts by value, never by delete: when the triggering
            # pair is no longer among the current favorites — un-favorited, or cascaded
            # away with its article — emit it inactive so the profile read
            # (active=is.true) drops it instead of orphaning it. The row repeats the
            # pair's own columns because PostgREST rejects a bulk insert whose objects
            # disagree on their key set, so all five keys must be present on every object.
            let event_id = if $from_favorite { $event_row.user_id + ":" + $event_row.article_id } else { "" }
            let retractions = if $from_favorite && $active_rows.filter(r -> r.id == $event_id).length() == 0 {
              [{
                "id": $event_id,
                "user_id": $event_row.user_id,
                "article_id": $event_row.article_id,
                "active": false,
                "favorited_at": $event_row.created_at,
              }]
            } else { [] }

            root = if $from_favorite { $active_rows.concat($retractions) } else { deleted() }
    - catch:
        - log:
            level: ERROR
            message: 'favorite-index: transform failed (${! error() }) on ${! content() }'
        - mapping: root = deleted()
output:
  retry:
    max_retries: 3
    backoff:
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 3m
    output:
      http_client:
        url: '${CRUD_URL}/favorite_index?on_conflict=id'
        verb: POST
        headers:
          Authorization: 'Bearer ${SERVICE_JWT}'
          Content-Type: application/json
          Prefer: resolution=merge-duplicates
        successful_on:
          - 200
          - 201
