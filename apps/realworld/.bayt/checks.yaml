# generated from bayt.cue — do not edit
say:
  integrate:
    rulemap:
      builtin:
        stop: false
      replay:
        cmds:
        - do: use integrate.nu; integrate --bake --no-up --with-buildx --target ci-replay
      pronto-integrate-1:
        priority: 1
        cmds:
        - do: use integrate.nu; integrate --bake --no-up --with-buildx --target ci-favorites
      visual:
        cmds:
        - do: use integrate.nu; integrate --bake --no-up --with-buildx --target ci-visual
  launch:
    rulemap:
      builtin:
        cmds:
        - do: >-
            if not ('.certs/localhost.pem' | path exists) { mkdir .certs; mise exec --
            mkcert -cert-file .certs/localhost.pem -key-file .certs/localhost-key.pem localhost
            127.0.0.1 ::1 }
        - do: launch
          use: ./launch.nu
  lint:
    rulemap:
      cue:
        cmds:
        - do: mise exec -- cue vet -c ./...
      rpk:
        cmds:
        - do: >-
            mise exec -- redpanda-connect lint --skip-env-var-check
            docker/realworld-favorite-recount.yaml docker/realworld-favorite-count.yaml
            docker/realworld-favorite-index.yaml docker/realworld-tag-recount.yaml
      facts:
        priority: 1
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read --allow-run --allow-env ($pronto | path join check-facts.ts) .
      sql:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read --allow-run --allow-env ($pronto | path join check-sql.ts) .
      identity:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read --allow-run --allow-env ($pronto | path join identity.ts) check .
      caddy:
        cmds:
        - do: "with-env {ELECTRIC_SECRET: lint, ORIGIN: lint} { mise exec -- caddy adapt --config docker/Caddyfile --adapter caddyfile out> (if $nu.os-info.name == \"windows\" { \"NUL\" } else { \"/dev/null\" }) }"
      handlers:
        cmds:
        - do: use tools.nu [run-mise]; run-mise exec -- omnishell check handlers .
      markup:
        cmds:
        - do: use tools.nu [run-mise]; run-mise exec -- omnishell check markup .
      derive:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read=. ($pronto | path join derive.ts) --self-test
      types:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); let files = do { cd $pronto; [ ...(glob --no-dir --exclude [*_test.ts
            *.test.ts hybrid-local.ts hybrid-battery.ts refresh-portable-types.ts] '*.ts')
            ...(glob --no-dir 'scales/*.ts') ] }; run-mise exec -- deno check --config
            ($pronto | path join deno.json) ...$files
      proto:
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run --config ($pronto | path join deno.json)
            --allow-read --allow-run --allow-env ($pronto | path join check-proto.ts) .
  release:
    rulemap:
      cloudflare:
        cmds:
        - do: >-
            if ($env.SAY_RELEASE_ARGS_FROM? | is-empty) { use tools.nu [run-mise]; let
            pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno
            run -A --config ($pronto | path join bundle deno.json) ($pronto | path join bundle
            derived.ts) . --tables article_stats,favorite_count,favorite_index,me,tag_count
            --streams
            realworld-favorite-count,realworld-favorite-index,realworld-favorite-recount,realworld-tag-recount --out dist/derived.sql }
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); let data = if ($env.SAY_RELEASE_ARGS_FROM? | is-not-empty) {
            ['--from' $env.SAY_RELEASE_ARGS_FROM] } else { ['--derived' 'dist/derived.sql'] };
            run-mise exec -- deno run -A --config ($pronto | path join bundle deno.json) ($pronto |
            path join bundle edge.ts) . --omnishell (run-mise where
            github:bonisoft3/omnishell | str trim) --mecha (run-mise where github:bonisoft3/mecha | str trim) --out
            dist/cloudflare ...$data --ice-servers '[{"urls":"stun:stun.cloudflare.com:3478"}]'
        - do: >-
            if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { release --skip=validate
            --clean } else { release --snapshot --skip=validate --clean }
          use: ./release.nu
        - do: >-
            if ($env.SAY_RELEASE_ARGS_SNAPSHOT? | is-empty) { use tools.nu [run-mise]; let
            pronto = (run-mise where github:bonisoft3/pronto | str trim); run-mise exec --
            deno run -A --config ($pronto | path join bundle deno.json) ($pronto | path join
            bundle publish-edge.ts) dist/cloudflare --mecha (run-mise where
            github:bonisoft3/mecha | str trim) ...(if ($env.SAY_RELEASE_ARGS_RESET? | is-empty) { [] } else {
            ['--reset'] }) ...(if ($env.SAY_RELEASE_ARGS_TEMPORARY? | is-empty) { [] } else {
            ['--temporary'] }) }
        platform: cloudflare
  self:
    version: v0.45.2
  doctor:
    do: >-
      use tools.nu [run-mise]; run-mise exec -- cue version; run-mise exec -- deno
      --version; run-mise where github:bonisoft3/pronto
  build:
    do: "null"
  generate:
    rulemap:
      omnishell:
        priority: 0
        cmds:
        - do: >-
            if ('program.cue' | path exists) { use tools.nu [run-mise]; run-mise exec --
            omnishell mode . | save --force program_terminal.cue }
      auto-cue:
        cmds:
        - use: ./tools.nu
          do: >-
            if ('pronto/generate_tool.cue' | path exists) { tools run-cue cmd generate
            ./pronto }
      pronto:
        priority: 1
        cmds:
        - do: >-
            if ('program.cue' | path exists) { use tools.nu [run-mise]; let pronto =
            (run-mise where github:bonisoft3/pronto | str trim); run-mise exec -- deno run --config
            ($pronto | path join deno.json) --allow-read --allow-write=. --allow-run
            --allow-env ($pronto | path join write.ts) . }
      auto-bayt:
        priority: 2
        cmds:
        - use: ./auto-bayt.nu
          do: auto-bayt
  setup:
    rulemap:
      builtin:
        cmds:
        - do: setup
          use: ./setup.nu
        - do: mkdir .certs
        - do: >-
            mise exec -- mkcert -cert-file .certs/localhost.pem -key-file
            .certs/localhost-key.pem localhost 127.0.0.1 ::1
        - do: "print 'the browser trusts this certificate only once you run: mise exec -- mkcert -install'"
  test:
    rulemap:
      builtin:
        stop: false
        cmds:
        - do: test
          use: ./test.nu
      article:
        cmds:
        - do: >-
            deno test --config tests/deno.json --no-lock --no-check --allow-env
            --allow-read tests/article.test.ts
      home:
        cmds:
        - do: >-
            deno test --config tests/deno.json --no-lock --no-check --allow-env
            --allow-read tests/home.test.ts
      editor:
        cmds:
        - do: >-
            deno test --config tests/deno.json --no-lock --no-check --allow-env
            --allow-read tests/editor.test.ts
      auth:
        cmds:
        - do: >-
            deno test --config tests/deno.json --no-lock --no-check --allow-env
            --allow-read tests/auth.test.ts
      edge-projections:
        cmds:
        - do: >-
            deno test --config tests/deno.json --lock tests/deno.lock --frozen --allow-read
            tests/edge-projections.test.ts
      machines:
        cmds:
        - do: use tools.nu [run-mise]; run-mise exec -- omnishell check machines .
      i18n:
        cmds:
        - do: use tools.nu [run-mise]; run-mise exec -- omnishell check i18n .
      battery:
        cmds:
        - do: use tools.nu [run-mise]; run-mise exec -- omnishell check battery .
  verify:
    rulemap:
      cloudflare:
        platform: cloudflare
        cmds:
        - do: >-
            use tools.nu [run-mise]; let pronto = (run-mise where github:bonisoft3/pronto |
            str trim); run-mise exec -- deno run -A --config ($pronto | path join deno.json)
            ($pronto | path join verify verify.ts) . --platform cloudflare ...(if
            ($env.SAY_VERIFY_ARGS_TARGET? | is-empty) { [] } else { ['--target',
            $env.SAY_VERIFY_ARGS_TARGET] }) ...(if ($env.SAY_VERIFY_ARGS_TIER? | is-empty) { [] } else { ['--tier',
            $env.SAY_VERIFY_ARGS_TIER] }) ...(if ($env.SAY_VERIFY_ARGS_HEADLESS? | is-empty)
            { [] } else { ['--headless', $env.SAY_VERIFY_ARGS_HEADLESS] }) ...(if
            ($env.SAY_VERIFY_ARGS_SESSION? | is-empty) { [] } else { ['--session',
            $env.SAY_VERIFY_ARGS_SESSION] })
